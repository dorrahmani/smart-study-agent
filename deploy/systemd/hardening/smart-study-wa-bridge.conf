# Installed as /etc/systemd/system/smart-study-wa-bridge.service.d/hardening.conf (systemd-analyze security: 5.8 -> 1.5).
# 11/11/2026 hardening on top of the unit (which already has ProtectSystem=strict, ProtectHome=tmpfs + BindPaths,
# PrivateTmp, PrivateDevices, NoNewPrivileges, ProtectKernelTunables/Modules, ProtectControlGroups, LockPersonality).
[Service]
ProtectKernelLogs=yes
ProtectClock=yes
ProtectHostname=yes
RestrictSUIDSGID=yes
RestrictRealtime=yes
RemoveIPC=yes
PrivateIPC=yes
KeyringMode=private
CapabilityBoundingSet=
AmbientCapabilities=
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallErrorNumber=EPERM
ProtectProc=invisible
ProcSubset=pid
