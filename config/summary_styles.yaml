# Per-course summary guidelines — fed into the Gemini prompt (generators/summarizer.py). The prompt text below stays in Hebrew.
# Key = course_key from config/courses.yaml. A course with no entry here gets only the general guidelines.
# To edit: change here, commit, `git push vm`. (YAML — when writing from code, only yaml.safe_dump.)

probability:
  focus: |
    זה קורס מתמטי-כמותי. הסטודנט צריך לדעת לפתור תרגילים, לא רק להבין רעיונות.
    - כל הגדרה, משפט ונוסחה ב-LaTeX מלא ומדויק ($P(A\mid B)$, $\mathbb{E}[X]$, $\mathrm{Var}(X)$).
    - לכל התפלגות שמוזכרת: תנאים לשימוש, פונקציית הסתברות/צפיפות, תוחלת, שונות, ומתי מזהים אותה בשאלה.
    - דוגמה פתורה מלאה לכל נושא מרכזי — צעד אחר צעד, כולל למה בחרנו בכלי הזה.
    - טבלת "מתי משתמשים במה" (למשל: הסתברות שלמה מול בייס, בינומית מול פואסון) כשרלוונטי.
    - הדגש טעויות נפוצות: בלבול בין תלות לאי-תלות, ספירה כפולה, שכחת תנאי מקדים.

software_1:
  focus: |
    זה קורס תכנות ב-Java. הסטודנט צריך לקרוא ולכתוב קוד.
    - כל קוד בבלוק ```java עם הערות קצרות בעברית בתוך הקוד.
    - אחרי כל קטע קוד משמעותי: הסבר שורה-שורה או בלוק-בלוק מה קורה ולמה.
    - מושגי OOP (מחלקות, ירושה, ממשקים, פולימורפיזם, אנקפסולציה) — הגדרה + דוגמת קוד קצרה + מתי משתמשים.
    - ציין מה יודפס / מה יקרה בזמן ריצה בדוגמאות, כולל חריגות (exceptions) אפשריות.
    - טעויות נפוצות: == מול equals, NullPointerException, העברת reference מול value, off-by-one.
    - שמות מחלקות, מתודות ומילות מפתח נשארים באנגלית; ההסבר בעברית.

microeconomics_2:
  focus: |
    זה קורס כלכלה עם מודלים וגרפים. PDF לא מציג גרף מצויר — תאר גרפים במילים.
    - לכל גרף: מה על כל ציר, צורת העקומות, נקודת שיווי המשקל, ומה קורה כשעקומה זזה (ולאיזה כיוון).
    - לכל מודל: הנחות, משוואות ב-LaTeX, תנאי אופטימום (למשל $MRS = \frac{p_x}{p_y}$), ופירוש כלכלי של התוצאה.
    - דוגמה מספרית פתורה לכל מודל מרכזי.
    - הבחן במפורש בין השפעת תחלופה להשפעת הכנסה, בין טווח קצר לארוך, כשרלוונטי.
    - הגדרות מושגים בקצרה ובדיוק — מבחנים שואלים על ניסוח מדויק.

macroeconomics:
  focus: |
    זה קורס מאקרו-כלכלה עם מודלים, זהויות ונתונים. PDF לא מציג גרף מצויר — תאר גרפים במילים.
    - לכל מודל (למשל IS-LM, AD-AS, מודלי צמיחה): המשוואות ב-LaTeX, המשתנים, ומה מזיז כל עקומה.
    - "מה קורה אם": לכל שינוי מדיניות (מוניטרית/פיסקלית) — שרשרת ההשפעה צעד אחר צעד, בטווח קצר וארוך.
    - זהויות חשבונאיות (למשל $Y = C + I + G + NX$) — מתי הן נכונות תמיד ומתי זו הנחת מודל.
    - דוגמה מספרית פתורה כשהמרצה נותן מספרים.
    - הגדרות מדדים (תמ"ג, אינפלציה, אבטלה) — כולל מה המדד לא מודד.
