settings:
  panopto:
    base_url: https://tau.cloud.panopto.eu
    upload_delay_days: 1
  moodle:
    base_url: https://moodle.tau.ac.il
  schedule:
    days_back: 7
    run_time: 08:00
    timezone: Asia/Jerusalem
    semester_start: '2026-10-17'
    semester_end: '2027-01-18'
    no_class_dates:
    - '2026-10-27'
    max_send_age_days: 14
  ai:
    provider: gemini
    model: gemini-3.1-pro-preview
    max_tokens: 8000
    temperature: 0.3
  email:
    recipient: you@example.com
    subject_template: סיכום {course_name} - {date}
    attach_pdf: false
