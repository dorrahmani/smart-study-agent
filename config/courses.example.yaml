# ════════════════════════════════════════════════════════════════════
#  config/courses.example.yaml — EXAMPLE course config.
#  Copy to config/courses.yaml (gitignored) and replace with YOUR courses:
#    python scripts/setup_check.py --init      (does the copy for you)
#  Per course:
#    name / course_code      – title and catalog number as shown in my.tau
#    my_sessions             – YOUR group's weekly slots (day: sun..thu, local time);
#                              the collector keeps only recordings in these slots
#    sources.panopto.folder_id – the Panopto folder GUID of the course
#                              (scripts/find_panopto_folders.py lists them)
#    sources.moodle.course_id  – the number in moodle.tau.ac.il/course/view.php?id=…
#    lecture/tutorial_keywords – optional fallback: words in the recording title
#    my_staff / other_staff  – optional: tutor names of your groups / other groups (relevance filter)
#  settings.schedule.semester_start/end – the pipeline is idle outside this window.
#  All ids, names, rooms and slots below are placeholders.
# ════════════════════════════════════════════════════════════════════
