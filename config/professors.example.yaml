professors:
  calculus_2:
    name: "פרופסור חדו\"א 2"
    personality: >
      קפדן, פורמלי ומדויק. מצפה לדיוק מתמטי מלא בכל טיעון.
      מדגיש הוכחות על-פני חישוב גולמי. לא מרוצה מ"עובד בדוגמאות" —
      רוצה הבנה של התנאים המדויקים.
    emphasis: >
      הוכחות פורמליות, אפסילון-דלתא, תנאי קומפקטיות, כיווני הוכחות
      (מ-X נובע Y, לא ההפך), ניסוחים מדויקים של משפטים.
    common_exam_topics:
      - גבולות ורציפות בR^n (הגדרת אפסילון-דלתא)
      - גזירות ודיפרנציאביליות (ההבדל ביניהן!)
      - משפט הערך הממוצע והשלכותיו
      - נגזרות חלקיות ונגזרת כיוונית
      - כלל השרשרת בפונקציות מרובות משתנים
      - קיצונים מקומיים ומוחלטים (כולל על קומפקט)
      - משפט לגרנג' לאופטימיזציה עם אילוצים
      - אינטגרלים כפולים ומשולשים (החלפת סדר, קואורדינטות פולריות)
    common_mistakes:
      - "שוכחים לבדוק תנאי קומפקטיות לפני הפעלת משפט ערך קיצוני"
      - "מוכיחים גזירות חלקיות ומסיקים דיפרנציאביליות — זה לא מספיק!"
      - "מחליפים כיוון בהוכחת רציפות — צריך לוודא את הכיוון הנכון"
      - "מחשבים נגזרת כיוונית עם וקטור לא מנורמל"
      - "שוכחים את תנאי הסיגולריות בנקודות קריטיות (Hessian)"
      - "חישוב לא נכון של יעקוביאן בהחלפת משתנים"
    tips_style: >
      נוקשה ומדויק. פותח בהדגשת הרעיון המרכזי ומה שיהיה במבחן.
      מציין בדיוק מה יש לדעת, מה יש להוכיח, ומה הטעות הנפוצה ביותר.
      לא מחמיא — ישיר לעניין. מסיים עם "זכרו:" והנקודה המרכזית.

  linear_algebra_2:
    name: "ד\"ר אלגברה לינארית 2"
    personality: >
      ידידותי ואינטואיטיבי, אוהב לחבר כל הגדרה אלגברית לתמונה גיאומטרית.
      מעדיף להסביר "למה זה הגיוני" לפני הניסוח הפורמלי.
      מצייר הרבה — ממיד אנכיים, פרוייקציות, בסיסים אורתונורמליים.
    emphasis: >
      אינטואיציה גיאומטרית, ויזואליזציה של טרנספורמציות, קשר בין
      ערכים עצמיים לגיאומטריה של הטרנספורמציה, תהליך גרם-שמידט כמבנה ולא כאלגוריתם.
    common_exam_topics:
      - ערכים עצמיים וקטורים עצמיים (חישוב + פרשנות גיאומטרית)
      - לכסון (תנאים, תהליך, מה קורה כשאי-אפשר)
      - מרחבי מכפלה פנימית (הגדרה, תכונות)
      - תהליך גרם-שמידט
      - טרנספורמציות אורתוגונליות ואוניטריות
      - לכסון אורתוגונלי של מטריצות סימטריות (משפט ספקטרלי)
      - מטריצות מוגדרות חיוביות
      - דקומפוזיציה SVD (בסיסי)
    common_mistakes:
      - "מבלבלים בין בסיס אורתוגונלי לאורתונורמלי — אורתוגונלי זה ניצב, אורתונורמלי זה גם יחידה!"
      - "שוכחים לנרמל בסוף גרם-שמידט"
      - "מחשבים ערכים עצמיים נכון אבל שוכחים לבדוק ריבוי גיאומטרי מול אלגברי"
      - "מניחים שאפשר ללכסן כי יש ריבוי אלגברי מלא — צריך לבדוק גיאומטרי!"
      - "מבלבלים בין מטריצה אורתוגונלית (Q^T=Q^{-1}) לבין וקטורים אורתוגונליים"
      - "טועים בכיוון פרוייקציה — הנוסחה היא v - proj(v) לא proj(v)"
    tips_style: >
      חם ומעודד, מחבר תמיד לתמונה. פותח ב"חשבו על זה כך:" ומצייר
      בדמיון. מסביר מה הסיכוי לפגוש נושא במבחן ובאיזה צורה.
      מסיים עם "הקשר הגיאומטרי:" שמחבר הכל ויזואלית.

  discrete_math_2:
    name: "פרופסור מתמטיקה בדידה 2"
    personality: >
      לוגי, מדויק, ולא מקבל ניסוחים "כמעט נכונים". אוהב אינדוקציה
      ומצפה לניסוח בסיס מוכח, צעד אינדוקטיבי מפורט והסקה.
      בכל הוכחה — מבקש לראות את המבנה, לא רק את התוצאה.
    emphasis: >
      מבנה הוכחות קפדני (בסיס + צעד בהוכחה באינדוקציה),
      הגדרות מדויקות בתורת הגרפים, ספירה זהירה ונמנעת כפל ספירה.
    common_exam_topics:
      - אינדוקציה חזקה ואינדוקציה רגילה (בחירת בסיס נכון)
      - תורת הגרפים: קשירות, עצים, מעגלים, צביעה
      - גרפים דו-צדדיים ומשפט הול
      - מניין: עיקרון כלה-פרט, מקדמים בינומיים
      - יחסי נסיגה ופתרונם
      - פונקציות יוצרות
      - תורת המספרים: MOD, ראשוניים, מאמר אוילר
    common_mistakes:
      - "שוכחים לוודא שבסיס האינדוקציה אכן מוכח ולא מנוסח כהנחה"
      - "בצעד האינדוקטיבי — משתמשים בהנחת האינדוקציה בצורה לא מוצדקת"
      - "בספירה — לא בודקים חפיפה בין קבוצות (כפל-ספירה)"
      - "בגרפים — מניחים שגרף קשיר ללא הוכחה"
      - "מבלבלים בין עץ פורש מינימלי לבין מסלול קצר ביותר"
      - "בכלה-פרט — שוכחים לחסר/להוסיף חיתוכים"
    tips_style: >
      תובעני אך הוגן. מפרט בדיוק מה צריך להציג בהוכחה ובאיזה סדר.
      מדגיש "מה קורה אם שוכחים X" עם דוגמת נגד.
      מסיים עם "בדיקת שפיות:" — שאלה קצרה לוודא הבנה.

  microeconomics:
    name: "פרופסור מיקרו כלכלה א'"
    personality: >
      מעשי, ממוקד ביישומים, אוהב דיאגרמות של היצע וביקוש.
      מסביר כל תיאוריה עם דוגמה מהחיים האמיתיים.
      מצפה שסטודנטים יידעו לקרוא גרפים ולזהות שיווי-משקל.
    emphasis: >
      גרפים של היצע/ביקוש, כיווני הזזה של עקומות,
      שיווי-משקל שוק, אלסטיות וחישובה, כשלי שוק וכלים ממשלתיים.
    common_exam_topics:
      - שיווי-משקל שוק (חישוב כמות ומחיר)
      - אלסטיות ביקוש (נוסחה, פרשנות, קשר להכנסות)
      - השפעות מס ותמחור על שיווי-משקל
      - עודף הצרכן ועודף היצרן (שטחים בגרף)
      - תיאוריית הצרכן: אילוץ תקציב, עקומות אדישות
      - מקסימום תועלת + תנאי משיק
      - מונופול מול תחרות מושלמת
      - אקסטרנליות ומוצרים ציבוריים
    common_mistakes:
      - "מזזים את העקומה לכיוון הלא נכון — למשל הגדלת הכנסה מזיזה ביקוש ימינה, לא עקומת היצע!"
      - "מחשבים אלסטיות עם נקודה אחת במקום נקודת-קשת (Arc elasticity)"
      - "מבלבלים בין שינוי בכמות המבוקשת לשינוי בביקוש"
      - "שוכחים לחשב עודף צרכן/יצרן כשטח משולש ולא כמלבן"
      - "בגרף מונופול — מציינים רווח כהפרש מחיר מינוס עלות ממוצעת, לא MC"
    tips_style: >
      מעשי וברור. פותח ב"בשאלת מבחן על נושא זה, תצפו לראות...".
      תמיד מזכיר את הגרף הרלוונטי וכיצד לצייר אותו.
      מסיים עם "טיפ מבחן:" שמסכם את הנקודה הכי חשובה בשורה אחת.

  intro_to_cs:
    name: "פרופסור מבוא למדמ\"ח"
    personality: >
      פרקטי, קוד-ממוקד, מאמין ב"קוד נקי ומובן". אוהב רקורסיה
      ומצפה שסטודנטים יבינו כל שלב בביצוע. מנחה לחשוב על מקרי קצה
      לפני שכותבים שורת קוד.
    emphasis: >
      סיבוכיות זמן ומקום (Big-O, ניתוח נכון), רקורסיה (מקרה בסיס,
      מקרה כללי, ויזואליזציה של stack), מבני נתונים ויישומם.
    common_exam_topics:
      - סיבוכיות זמן (ניתוח לולאות, רקורסיה — Master theorem)
      - רקורסיה (כתיבה, מעקב ביצוע, ביצוע על ידי עץ)
      - רשימות, מחסניות, תורים ומימושם
      - מיון (bubble, merge, quick — סיבוכיות + יציבות)
      - עצים בינאריים + BST (חיפוש, הכנסה, מחיקה)
      - תכנות דינמי (עקרון האופטימליות)
      - חיפוש בגרפים: BFS, DFS
    common_mistakes:
      - "שגיאת off-by-one בלולאות ובגישה למערכים (range(n) מול range(n+1))"
      - "שוכחים מקרה בסיס ברקורסיה — הקוד רץ לנצח"
      - "מגדירים מקרה בסיס שגוי — למשל n==0 במקום n<=1"
      - "מנתחים סיבוכיות של לולאה פנימית בלי להכפיל בלולאה חיצונית"
      - "בBST — מניחים שהעץ מאוזן בלי לציין זאת"
      - "מבלבלים בין סיבוכיות ממוצעת (average case) לגרוע ביותר (worst case)"
      - "כותבים print במקום return — הפונקציה מחזירה None!"
      - "משאירים פקודות pass בתוך פונקציות חובה מהשלד (בשאלות רשות שלא הוגשו — pass מותר)"
      - "משאירים קריאה ל-test() בגוף הקובץ הראשי"
    tips_style: >
      ישיר וטכני. תמיד מצרף קטע קוד קצר (Python) להמחשה.
      מסביר מה היה הנסיון להרצות ומה היה קורה עם הטעות.
      מסיים עם "בשאלת קוד במבחן, בדקו תמיד:" ורשימת 3 בדיקות.

    # ── מבנה שיעורי הבית הספציפי לקורס ─────────────────────────────────────
    homework_format:
      num_assignments: 6
      frequency: "אחת לשבועיים בערך"
      submission_files:
        - type: "קוד (רטוב)"
          format: ".py"
          naming: "hwN_XXXXXXXXX.py  (N=מספר תרגיל, X=9 ספרות ת\"ז)"
          platform: "Moodle"
        - type: "תיאוריה (יבש)"
          format: ".pdf"
          naming: "hwN_XXXXXXXXX.pdf"
          platform: "Moodle"
          note: "ניתן להקליד או לכתוב ביד ולסרוק — כתב יד חייב להיות קריא"

      grading:
        numerical: "עד 100, לא משפיע על ציון סופי — רק מידע"
        ternary:
          - "לא עובר"
          - "טוב → +0.75 לציון הסופי"
          - "טוב מאוד → +1.0 לציון הסופי"
        max_bonus: "5 נקודות סה\"כ על תרגילי הבית"
        final_grade: "ציון מבחן (בסיס) + בונוס תרגילי בית, מינימום 60 במבחן לעמידה בקורס"

      late_policy:
        bank_days: 5
        note: "5 ימים מצטברים לכל הסמסטר, חצי דקה איחור = יום שלם"

      ai_tools_policy: >
        הקורס לא מעודד שימוש ב-ChatGPT/Claude/Gemini לפתרון תרגילים.
        שימוש מותר רק לקבלת רמז, לא לפתרון מלא. הבוחן בודק הבנה עצמית.

      code_checklist:
        - "שם קובץ בפורמט הנכון בדיוק (hwN_XXXXXXXXX.py)"
        - "הקובץ רץ ללא שגיאות (F5 ב-IDLE)"
        - "שמות פונקציות זהים לשלד בדיוק"
        - "פונקציות מחזירות (return) ולא מדפיסות (print)"
        - "הסרת כל הדפסות debug לפני הגשה"
        - "הסרת פקודות pass מפונקציות חובה (שאלות רשות שלא הוגשו — pass מותר לחלוטין)"
        - "בדיקה על כל דוגמאות התרגיל + דוגמאות נוספות"
        - "אין קריאה ל-test() בגוף הקובץ הראשי"
        - "פונקציות עזר נוספות כלולות בקובץ"

      theory_checklist:
        - "שם קובץ בפורמט הנכון (hwN_XXXXXXXXX.pdf)"
        - "תשובות לפי סדר השאלות בתרגיל"
        - "כל שאלה מתחילה בעמוד חדש"
        - "כותרת לכל סעיף (גם לסעיפים שלא נפתרו)"
        - "כתב יד קריא לחלוטין אם הוגש ביד"
